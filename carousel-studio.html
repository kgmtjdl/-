<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>캐러셀 제작 · 서이 스튜디오</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #150f12;
    background: radial-gradient(circle at 50% 0%, #241419 0%, #150f12 55%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: #f2ece7;
    padding: 28px 16px 60px;
  }
  .page-head {
    max-width: 900px;
    margin: 0 auto 22px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #d9a9b8;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .back-link:hover { color: #ff8fb8; }
  .page-title {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
  }
  .page-sub {
    font-size: 13px;
    color: #b9aeb2;
    margin: 4px 0 0;
  }
  #root-wrap {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
  }
</style>
</head>
<body>

  <div class="page-head">
    <a class="back-link" href="./index.html">← 서이 스튜디오로 돌아가기</a>
    <h1 class="page-title">캐러셀 제작</h1>
    <p class="page-sub">사진·영상 위에 텍스트 박스를 얹는 오버레이 스튜디오</p>
  </div>

  <div id="root-wrap">
    <div id="root">
      <div id="root-loading" style="color:#b9aeb2; font-size:13px; padding:40px 0; text-align:center;">불러오는 중...</div>
    </div>
  </div>

  <div id="err-banner" style="display:none; max-width:900px; margin:16px auto 0; background:#3a1a20; border:1px solid #7a2c3a; color:#ffb3c2; border-radius:10px; padding:14px 16px; font-size:12.5px; line-height:1.6; white-space:pre-wrap;"></div>

  <script>
    function showErr(msg) {
      var el = document.getElementById('err-banner');
      if (!el) return;
      el.style.display = 'block';
      el.textContent = '오류가 발생했어요:\n' + msg + '\n\n이 화면을 캡처해서 보내주세요.';
    }
    window.addEventListener('error', function (e) { showErr(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { showErr(String(e.reason)); });
  </script>

        .cs-shell { background:#EDECE8; border-radius:14px; padding:16px; display:inline-block; }

        .cs-urlbar { flex:1; background:#FFFFFF; border:1px solid #DEDCD5; border-radius:7px; padding:5px 10px; font-size:10.5px; color:#8a8a86; }
